name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  # 也可以在 仓库页面 → Actions → 左侧选中本流程 → Run workflow 手动触发
  workflow_dispatch:

jobs:
  # ===========================================================================
  # 【本仓库修改】先检查有没有配置签名密钥；没有就跳过，不让 Actions 变红。
  #
  # 为什么不能直接写 `if: secrets.KEYSTORE_BASE64 != ''`：
  #   GitHub Actions 的 if 条件可用的上下文里 **不包含 secrets**
  #   （job 级 if 只有 github / needs / vars / inputs；steps 级 if 还多 env 等），
  #   所以必须先把 secret 映射进 env，在步骤里判断，再用 needs.<job>.outputs 去 gate。
  # ===========================================================================
  check:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.signing.outputs.ready }}
    steps:
      - name: Check signing secrets
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "签名密钥已配置，继续构建 Release 包。"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=已跳过 Release 构建::本仓库尚未配置签名密钥（KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD），本次不构建 Release 包。想启用请在 Settings → Secrets and variables → Actions 里补齐这 4 个密钥。"
          fi

  build:
    needs: check
    if: needs.check.outputs.ready == 'true'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Decode Keystore
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore

    - name: Build Release APK
      run: ./gradlew assembleRelease
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    - name: Get version name
      id: version
      run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        name: AutoGLM For Android ${{ steps.version.outputs.VERSION }}
        files: app/build/outputs/apk/release/*.apk
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
